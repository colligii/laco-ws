services:
  api:
    image: minha-imagem-de-chat
    build: .
    command: node dist/index.js
    ports:
      - "3001:3001"
    restart: always

  worker:
    image: minha-imagem-de-chat
    build: .
    command: node dist/worker.js
    restart: always
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: '2'
          memory: 1G